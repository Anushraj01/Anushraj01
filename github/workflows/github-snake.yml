name: Generate Snake Animation

# Regenerates a custom-colored "snake eats your contribution graph" SVG/GIF
# and pushes it to the "output" branch, which README.md embeds directly.
# Docs: https://github.com/Platane/snk

on:
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game from contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Anushraj01
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#ff5cb3
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff5cb3
            dist/github-snake-light.svg?palette=github-light&color_snake=#9b5cff
            dist/github-snake.gif?color_snake=#ff5cb3,#9b5cff,#5ce1ff&color_dots=#150822,#2d1150,#3d0f3f,#9b5cff,#ff5cb3

      - name: Push snake output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
